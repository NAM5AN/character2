name: One-time resume previous-question fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-resume-prev.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch AnalyzeFlow resume navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/AnalyzeFlow.tsx')
          text = path.read_text()

          old_helpers = """function responseDataFromAnswer(answer:InterviewAnswer|undefined):ResponseData{if(!answer?.branchContext||typeof answer.branchContext!=='object')return{};const raw=(answer.branchContext as Record<string,unknown>).responseData;return raw&&typeof raw==='object'?raw as ResponseData:{}}\nfunction RankingActionIcon({direction}:{direction:'up'|'down'|'remove'}){"""
          new_helpers = """function responseDataFromAnswer(answer:InterviewAnswer|undefined):ResponseData{if(!answer?.branchContext||typeof answer.branchContext!=='object')return{};const raw=(answer.branchContext as Record<string,unknown>).responseData;return raw&&typeof raw==='object'?raw as ResponseData:{}}\nfunction questionSnapshotFromAnswer(answer:InterviewAnswer):InterviewQuestion|null{if(!answer.branchContext||typeof answer.branchContext!=='object')return null;const raw=(answer.branchContext as Record<string,unknown>).questionSnapshot;if(!raw||typeof raw!=='object')return null;const candidate=raw as Partial<InterviewQuestion>;return Number.isInteger(candidate.order)&&typeof candidate.question==='string'?raw as InterviewQuestion:null}\nfunction stripQuestionSnapshot(answer:InterviewAnswer):InterviewAnswer{if(!answer.branchContext||typeof answer.branchContext!=='object')return answer;const branchContext={...(answer.branchContext as Record<string,unknown>)};delete branchContext.questionSnapshot;return {...answer,branchContext}}\nfunction historyFromSavedSession(saved:Partial<SavedAnalysisSession>){const direct=Array.isArray(saved.questionHistory)?mergeQuestionHistory([],saved.questionHistory as InterviewQuestion[]):[];const persistedAnswers=Array.isArray(saved.answers)?uniqueAnswersByOrder(saved.answers as InterviewAnswer[]):[];const snapshots=persistedAnswers.map(questionSnapshotFromAnswer).filter((item):item is InterviewQuestion=>Boolean(item));const current=saved.question&&typeof saved.question==='object'?saved.question as InterviewQuestion:null;return mergeQuestionHistory(direct,[...snapshots,...(current?[current]:[])])}\nfunction answersForPersistence(items:InterviewAnswer[],history:InterviewQuestion[]){const questionsByOrder=new Map(history.map(item=>[item.order,item]));return uniqueAnswersByOrder(items).map(answer=>{const snapshot=questionsByOrder.get(answer.order);if(!snapshot)return answer;const branchContext=answer.branchContext&&typeof answer.branchContext==='object'?{...(answer.branchContext as Record<string,unknown>)}:{};return {...answer,branchContext:{...branchContext,questionSnapshot:snapshot}}})}\nfunction persistedNavigationHistory(){try{const raw=localStorage.getItem(ANALYSIS_SESSION_KEY);if(!raw)return[];return historyFromSavedSession(JSON.parse(raw) as Partial<SavedAnalysisSession>)}catch{return[]}}\nfunction RankingActionIcon({direction}:{direction:'up'|'down'|'remove'}){"""
          if old_helpers not in text:
              raise SystemExit('helper anchor not found')
          text = text.replace(old_helpers, new_helpers, 1)

          old_restore = """  function restoreSavedSession(saved:SavedAnalysisSession){\n    const restoredDraft=saved.draft&&typeof saved.draft==='object'?saved.draft as CharacterDraft:null;\n    const restoredAnswers=Array.isArray(saved.answers)?uniqueAnswersByOrder(saved.answers as InterviewAnswer[]):[];\n    const restoredHistory=Array.isArray(saved.questionHistory)?mergeQuestionHistory([],saved.questionHistory as InterviewQuestion[]):[];\n    const requestedIndex=Number.isInteger(saved.activeQuestionIndex)?Number(saved.activeQuestionIndex):Math.max(0,restoredHistory.length-1);\n    const restoredIndex=restoredHistory.length?Math.max(0,Math.min(requestedIndex,restoredHistory.length-1)):0;\n    const restoredQuestion=(saved.question&&typeof saved.question==='object'?saved.question:null) as InterviewQuestion|null || restoredHistory[restoredIndex] || null;\n    setName(typeof saved.name==='string'?saved.name:'');setProfileText(typeof saved.profileText==='string'?saved.profileText:'');setSecretProfileText(typeof saved.secretProfileText==='string'?saved.secretProfileText:'');setDraft(restoredDraft);setAnswers(restoredAnswers);setHistory(restoredHistory);setQuestion(restoredQuestion);setActiveQuestionIndex(restoredIndex);setSelected(typeof saved.selected==='string'?saved.selected:'');setCustom(typeof saved.custom==='string'?saved.custom:'');setReason(typeof saved.reason==='string'?saved.reason:'');setMultiSelected(Array.isArray(saved.multiSelected)?saved.multiSelected:[]);setRanking(Array.isArray(saved.ranking)?saved.ranking:[]);setSliderValue(typeof saved.sliderValue==='number'?saved.sliderValue:50);setMatrixAnswers(saved.matrixAnswers&&typeof saved.matrixAnswers==='object'?saved.matrixAnswers:{});setSecondary(typeof saved.secondary==='string'?saved.secondary:'');setError('');\n    if((saved.stage==='interview'||saved.stage==='finalizing')&&restoredDraft&&restoredQuestion)setStage('interview');else if(saved.stage==='review'&&restoredDraft)setStage('review');else setStage('input');\n  }"""
          new_restore = """  function restoreSavedSession(saved:SavedAnalysisSession){\n    const restoredDraft=saved.draft&&typeof saved.draft==='object'?saved.draft as CharacterDraft:null;\n    const persistedAnswers=Array.isArray(saved.answers)?uniqueAnswersByOrder(saved.answers as InterviewAnswer[]):[];\n    const restoredAnswers=persistedAnswers.map(stripQuestionSnapshot);\n    const restoredHistory=historyFromSavedSession(saved);\n    const requestedIndex=Number.isInteger(saved.activeQuestionIndex)?Number(saved.activeQuestionIndex):Math.max(0,restoredHistory.length-1);\n    const fallbackIndex=restoredHistory.length?Math.max(0,Math.min(requestedIndex,restoredHistory.length-1)):0;\n    const savedQuestion=(saved.question&&typeof saved.question==='object'?saved.question:null) as InterviewQuestion|null;\n    const restoredQuestion=savedQuestion||restoredHistory[fallbackIndex]||null;\n    const matchedIndex=restoredQuestion?restoredHistory.findIndex(item=>item.order===restoredQuestion.order):-1;\n    const restoredIndex=matchedIndex>=0?matchedIndex:fallbackIndex;\n    setName(typeof saved.name==='string'?saved.name:'');setProfileText(typeof saved.profileText==='string'?saved.profileText:'');setSecretProfileText(typeof saved.secretProfileText==='string'?saved.secretProfileText:'');setDraft(restoredDraft);setAnswers(restoredAnswers);setHistory(restoredHistory);setQuestion(restoredQuestion);setActiveQuestionIndex(restoredIndex);setSelected(typeof saved.selected==='string'?saved.selected:'');setCustom(typeof saved.custom==='string'?saved.custom:'');setReason(typeof saved.reason==='string'?saved.reason:'');setMultiSelected(Array.isArray(saved.multiSelected)?saved.multiSelected:[]);setRanking(Array.isArray(saved.ranking)?saved.ranking:[]);setSliderValue(typeof saved.sliderValue==='number'?saved.sliderValue:50);setMatrixAnswers(saved.matrixAnswers&&typeof saved.matrixAnswers==='object'?saved.matrixAnswers:{});setSecondary(typeof saved.secondary==='string'?saved.secondary:'');setError('');\n    if((saved.stage==='interview'||saved.stage==='finalizing')&&restoredDraft&&restoredQuestion)setStage('interview');else if(saved.stage==='review'&&restoredDraft)setStage('review');else setStage('input');\n  }"""
          if old_restore not in text:
              raise SystemExit('restore anchor not found')
          text = text.replace(old_restore, new_restore, 1)

          old_persist = "answers:uniqueAnswersByOrder(answers),question,questionHistory,activeQuestionIndex"
          new_persist = "answers:answersForPersistence(answers,questionHistory),question,questionHistory,activeQuestionIndex"
          if old_persist not in text:
              raise SystemExit('persistence anchor not found')
          text = text.replace(old_persist, new_persist, 1)

          old_nav = """  function previousQuestion(){if(busy||!question)return;const previous=questionHistory.filter(item=>item.order<question.order).at(-1);if(previous)applyQuestion(previous,questionHistory,answers)}\n  function forwardQuestion(){if(busy||!question)return;const next=questionHistory.find(item=>item.order===question.order+1);if(next)applyQuestion(next,questionHistory,answers)}"""
          new_nav = """  function previousQuestion(){if(busy||!question)return;const history=questionHistoryRef.current;const previous=history.filter(item=>item.order<question.order).at(-1);if(previous){applyQuestion(previous,history,answers);return}const persisted=persistedNavigationHistory().filter(item=>item.order<=question.order);const fallback=persisted.filter(item=>item.order<question.order).at(-1);if(fallback)applyQuestion(fallback,mergeQuestionHistory(history,persisted),answers)}\n  function forwardQuestion(){if(busy||!question)return;const history=questionHistoryRef.current;const next=history.find(item=>item.order===question.order+1);if(next)applyQuestion(next,history,answers)}"""
          if old_nav not in text:
              raise SystemExit('navigation anchor not found')
          text = text.replace(old_nav, new_nav, 1)

          path.write_text(text)
          PY
      - name: Verify patch
        run: npm run build
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-fix-resume-prev.yml
          git config user.name "NAM5AN"
          git config user.email "133747621+NAM5AN@users.noreply.github.com"
          git add src/components/AnalyzeFlow.tsx .github/workflows/one-time-fix-resume-prev.yml
          git commit -m "fix: restore previous interview navigation after resume"
          git pull --rebase origin main
          git push origin HEAD:main
