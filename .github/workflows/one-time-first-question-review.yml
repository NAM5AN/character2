name: One-time first-question review navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-first-question-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch first question back action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/AnalyzeFlow.tsx')
          text = path.read_text()
          old = "{question.order===1&&<button className=\"btn\" disabled={busy} onClick={()=>setStage('input')}>← 프로필 다시 작성하기</button>}"
          new = "{question.order===1&&<button className=\"btn\" disabled={busy} onClick={()=>setStage('review')}>← {draft?.basicProfile.name||name} 재확인</button>}"
          if old not in text:
              raise SystemExit('target button not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-first-question-review.yml
          git config user.name "NAM5AN"
          git config user.email "133747621+NAM5AN@users.noreply.github.com"
          git add src/components/AnalyzeFlow.tsx .github/workflows/one-time-first-question-review.yml
          git commit -m "fix: return first interview question to AI review"
          git pull --rebase origin main
          git push origin HEAD:main
