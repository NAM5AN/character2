name: Patch report cover grid

on:
  push:
    branches: [main]
    paths:
      - '.github/report-cover-grid-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch report cover structure
        run: |
          python - <<'PY'
          from pathlib import Path

          # ReportCover: make the right side a real grid column.
          path=Path('src/components/ReportMagazine.tsx')
          text=path.read_text()
          old='''export function ReportCover({ preview }: { preview: CharacterReportPreview }) {
  return <div className="report-mag"><section className="cover cover--summary-only">
    <div>
      <div className="cover-eyebrow">CHARACTER DETAIL REPORT</div>
      <h1>{preview.name}<span>정밀 캐릭터 분석</span></h1>
      {preview.oneLineSummary ? <p className="cover-quote">{preview.oneLineSummary}</p> : null}
    </div>
  </section></div>;
}'''
          new='''export function ReportCover({ preview, aside }: { preview: CharacterReportPreview; aside?: ReactNode }) {
  return <div className="report-mag"><section className="cover cover--summary-only">
    <div className="cover-summary-copy">
      <div className="cover-eyebrow">CHARACTER DETAIL REPORT</div>
      <h1>{preview.name}</h1>
      {preview.oneLineSummary ? <p className="cover-quote">{preview.oneLineSummary}</p> : null}
    </div>
    {aside ? <aside className="cover-summary-aside">{aside}</aside> : null}
  </section></div>;
}'''
          if old not in text:
              raise SystemExit('ReportCover block not found')
          path.write_text(text.replace(old,new,1))

          # CharacterReportView: move the save panel into ReportCover's aside prop.
          path=Path('src/components/CharacterReportView.tsx')
          text=path.read_text()
          text=text.replace("  const richSummary=Boolean(preview.summary.misunderstoodPoint?.trim()&&preview.summary.hiddenPattern?.trim());\n",'',1)
          text=text.replace("      .report-summary-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px}\n      .report-summary-copy{flex:1 1 340px;min-width:0}\n      .save-character-panel{flex:0 1 480px;max-width:520px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:rgba(255,255,255,.46)}", "      .cover-summary-aside{min-width:0}\n      .save-character-panel{width:100%;max-width:430px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:rgba(255,255,255,.62)}",1)
          text=text.replace("        .save-character-panel{flex-basis:100%;max-width:none}\n", "        .save-character-panel{max-width:none}\n",1)

          start=text.index('    <ReportCover preview={preview}/>')
          end=text.index('    <div style={{marginTop:24}}><SummaryNotes preview={preview}/></div>',start)
          replacement='''    <ReportCover preview={preview} aside={
      <div className="save-character-panel">
        <div className="label">캐릭터 저장</div>
        {canEditIdentity?<>
          <div className="save-character-row">
            <div className="field"><label className="label">오너명</label><input className="input" value={ownerName} maxLength={80} disabled={identityBusy} onChange={e=>{setOwnerName(e.target.value);setOwnerNameSaved(false);setIdentityError('')}} /></div>
            <button className="btn soft" disabled={identityBusy||!ownerName.trim()||ownerNameSaved} onClick={()=>void saveOwnerIdentity()}>{identityBusy?'저장 중…':ownerNameSaved?'저장 완료':'저장'}</button>
          </div>
          {identityError&&<p className="error" style={{marginBottom:0}}>{identityError}</p>}
        </>:preview.ownerName?<div style={{marginTop:9,fontSize:14}}>오너명 · <strong>{preview.ownerName}</strong></div>:null}
        <p className="save-character-note">오너명을 함께 저장해두면 나중에 리포트를 다시 꺼내볼 수 있고, 추후 2인·다인 페어 궁합이나 5~20인 이상 단체 조합 기능에도 지금 저장한 캐릭터 정보를 그대로 활용할 수 있어요.</p>
      </div>
    }/>

'''
          text=text[:start]+replacement+text[end:]
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ReportMagazine.tsx src/components/CharacterReportView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use a real two-column report cover layout"
          git push origin main
