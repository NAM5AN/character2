name: Patch report summary layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-report-summary-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch report cover and summary explorer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ReportMagazine.tsx')
          text = path.read_text()
          text = text.replace(
              'export function ReportCover({ preview }: { preview: CharacterReportPreview }) {',
              'export function ReportCover({ preview, aside }: { preview: CharacterReportPreview; aside?: ReactNode }) {',
              1,
          )
          text = text.replace('<h1>{preview.name}<span>정밀 캐릭터 분석</span></h1>', '<h1>{preview.name}</h1>', 1)
          cover_tail = '''      {preview.oneLineSummary ? <p className="cover-quote">{preview.oneLineSummary}</p> : null}
    </div>
  </section></div>;'''
          cover_tail_new = '''      {preview.oneLineSummary ? <p className="cover-quote">{preview.oneLineSummary}</p> : null}
    </div>
    {aside ? <aside className="cover-summary-aside">{aside}</aside> : null}
  </section></div>;'''
          if cover_tail not in text:
              raise SystemExit('cover tail not found')
          text = text.replace(cover_tail, cover_tail_new, 1)

          toggle_old = '''      <div className="summary-view-toggle" aria-label="요약 보기 방식">
        <button type="button" className={mode === 'glance' ? 'is-active' : ''} onClick={() => setMode('glance')}>한눈에 보기</button>
        <button type="button" className={mode === 'read' ? 'is-active' : ''} onClick={() => setMode('read')}>전체 읽기</button>
      </div>'''
          toggle_new = '''      <button
        type="button"
        className={`summary-view-toggle is-${mode}`}
        aria-label={mode === 'glance' ? '전체 읽기로 전환' : '한눈에 보기로 전환'}
        onClick={() => setMode(current => current === 'glance' ? 'read' : 'glance')}
      >
        <span className="summary-view-toggle-pill" aria-hidden="true" />
        <span className={`summary-view-label${mode === 'glance' ? ' is-active' : ''}`}>한눈에 보기</span>
        <span className={`summary-view-label${mode === 'read' ? ' is-active' : ''}`}>전체 읽기</span>
      </button>'''
          if toggle_old not in text:
              raise SystemExit('toggle not found')
          text = text.replace(toggle_old, toggle_new, 1)
          path.write_text(text)

          path = Path('src/app/report-summary-explorer.css')
          text = path.read_text()
          if '/* 2026-08 summary report polish */' not in text:
              text += r'''

/* 2026-08 summary report polish */
.report-mag .cover--summary-only {
  grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr);
  align-items: end;
  gap: 36px;
}
.report-mag .cover-summary-aside { min-width: 0; width: 100%; }
.report-mag .summary-view-toggle {
  position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr 1fr;
  flex: 0 0 auto; min-width: 202px; gap: 0; padding: 4px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.55);
  color: var(--muted); font: inherit; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.report-mag .summary-view-toggle-pill {
  position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
  border-radius: 999px; background: var(--ink); transform: translateX(0) scaleX(1);
  transform-origin: right center; transition: transform .5s cubic-bezier(.2,1.55,.36,1); will-change: transform;
}
.report-mag .summary-view-toggle.is-read .summary-view-toggle-pill { transform: translateX(100%) scaleX(1); transform-origin: left center; }
.report-mag .summary-view-label {
  position: relative; z-index: 1; display: grid; place-items: center; min-height: 34px; padding: 0 13px;
  color: var(--muted); font-size: 12px; font-weight: 800; white-space: nowrap; transition: color .16s ease; pointer-events: none;
}
.report-mag .summary-view-label.is-active { color: #fff; }
.report-mag .summary-view-toggle:active .summary-view-toggle-pill { filter: brightness(.92); }
.report-mag .summary-view-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.report-mag .summary-expanded-body { align-items: start; }
.report-mag .summary-expanded-body .summary-paragraph { align-self: start; margin-top: 0; height: auto; }
.report-mag .summary-expanded-body .summary-paragraph + .summary-paragraph { margin-top: 0; }
.report-mag .summary-read-item { border-bottom: 0; }
@media (max-width: 900px) {
  .report-mag .cover--summary-only { grid-template-columns: 1fr; align-items: stretch; }
  .report-mag .cover-summary-aside { margin-top: 4px; }
}
'''
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ReportMagazine.tsx src/app/report-summary-explorer.css
          git diff --cached --quiet && exit 0
          git commit -m "Polish report cover and summary toggle"
          git push origin main
