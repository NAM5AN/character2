name: Patch temporal compare UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-temporal-compare.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch AnalyzeFlow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/AnalyzeFlow.tsx')
          text = path.read_text()

          old_answer = "else if(type==='temporal_compare'){if(selected&&secondary)answer=`${config.leftLabel||'처음'}: ${selected} / ${config.rightLabel||'나중'}: ${secondary}`}"
          new_answer = "else if(type==='temporal_compare'){const leftValue=(customAnswer||selected).trim();const rightValue=secondary.trim();if(leftValue&&rightValue)answer=`${config.leftLabel||'처음'}: ${leftValue} / ${config.rightLabel||'나중'}: ${rightValue}`;answerSource=customAnswer?'custom':'structured'}"
          if old_answer not in text:
              raise SystemExit('temporal answer builder pattern not found')
          text = text.replace(old_answer, new_answer, 1)

          replacement = '''    if(type==='temporal_compare'){const leftChoices=question.options.slice(0,4);const rightChoices=(config.options2?.length?config.options2:question.options).slice(0,4);const leftCustom=selected?'':custom;const rightCustom=rightChoices.includes(secondary)?'':secondary;return <div className="two-col" style={{marginTop:20}}><div className="field"><label className="label">{config.leftLabel||'직후'}</label><div className="options">{leftChoices.map(o=><button disabled={busy} key={o} className={`option ${selected===o?'selected':''}`} onClick={()=>{setSelected(o);setCustom('')}}>{o}</button>)}<div className={`option ${leftCustom?'selected':''}`} style={{display:'block',cursor:'text'}}><strong style={{display:'block',marginBottom:8}}>직접 입력</strong><input disabled={busy} className="input" style={{width:'100%',padding:'9px 10px'}} placeholder="이 시점의 반응을 직접 적어주세요." value={leftCustom} onChange={e=>{setCustom(e.target.value);setSelected('')}}/></div></div></div><div className="field"><label className="label">{config.rightLabel||'시간이 지난 뒤'}</label><div className="options">{rightChoices.map(o=><button disabled={busy} key={o} className={`option ${secondary===o?'selected':''}`} onClick={()=>setSecondary(o)}>{o}</button>)}<div className={`option ${rightCustom?'selected':''}`} style={{display:'block',cursor:'text'}}><strong style={{display:'block',marginBottom:8}}>직접 입력</strong><input disabled={busy} className="input" style={{width:'100%',padding:'9px 10px'}} placeholder="이 시점의 반응을 직접 적어주세요." value={rightCustom} onChange={e=>setSecondary(e.target.value)}/></div></div></div></div>}'''
          pattern = r"    if\(type==='temporal_compare'\)return .*?;\n    if\(type==='condition_followup'\)"
          text, count = re.subn(pattern, replacement + "\n    if(type==='condition_followup')", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'temporal UI pattern replaced {count} times')

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AnalyzeFlow.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add distinct temporal choices and custom inputs"
          git push origin main
